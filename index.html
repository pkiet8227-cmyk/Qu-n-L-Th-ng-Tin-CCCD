<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nhập thông tin CCCD</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div>
      <h1>QUẢN LÝ CCCD</h1>
      <p>Nhập thông tin giấy tờ</p>
    </div>

    <button id="logoutBtn" class="btn btn-danger small">
      Đăng xuất
    </button>
  </header>


  <!-- LOGIN -->
  <section id="loginSection" class="login-section">

    <div class="login-card">

      <div class="logo-circle">
        CCCD
      </div>

      <h2>Đăng nhập hệ thống</h2>

      <p class="muted">
        Đăng nhập bằng tài khoản Google/Gmail
      </p>

      <button id="googleLoginBtn" class="google-btn">
        <span>G</span>
        Đăng nhập bằng Google
      </button>

      <div id="loginError" class="error-message"></div>

    </div>

  </section>


  <!-- MAIN -->
  <main id="mainSection" class="hidden">

    <div class="user-box">
      <div>
        <strong>Tài khoản:</strong>
        <span id="userEmail">---</span>
      </div>

      <a href="manager.html" class="manager-link">
        Quản lý dữ liệu →
      </a>
    </div>


    <!-- FORM -->
    <section class="card">

      <div class="card-title">
        <div>
          <h2>Nhập thông tin CCCD</h2>
          <p>Vui lòng nhập chính xác thông tin</p>
        </div>
      </div>


      <form id="cccdForm">

        <div class="form-group">
          <label for="hoTen">
            Họ và tên <span>*</span>
          </label>

          <input
            type="text"
            id="hoTen"
            placeholder="Nhập họ và tên"
            autocomplete="name"
            required
          >
        </div>


        <div class="form-group">
          <label for="cccd">
            Số CCCD <span>*</span>
          </label>

          <input
            type="text"
            id="cccd"
            placeholder="Nhập 12 số CCCD"
            inputmode="numeric"
            maxlength="12"
            required
          >
        </div>


        <div class="form-group">
          <label for="diaChi">
            Địa chỉ
          </label>

          <textarea
            id="diaChi"
            rows="3"
            placeholder="Nhập địa chỉ"
          ></textarea>
        </div>


        <div class="form-group">
          <label for="noiCap">
            Nơi cấp CCCD
          </label>

          <input
            type="text"
            id="noiCap"
            placeholder="Ví dụ: Cục Cảnh sát QLHC về TTXH"
          >
        </div>


        <div class="form-group">
          <label for="ngayCap">
            Ngày cấp
          </label>

          <input
            type="date"
            id="ngayCap"
          >
        </div>


        <button
          type="submit"
          id="saveBtn"
          class="btn btn-primary full"
        >
          Lưu thông tin
        </button>

      </form>

      <div id="formMessage"></div>

    </section>

  </main>

</div>


<script src="app.js"></script>

</body>
</html>
