<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nhập thông tin CCCD</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

<div class="app">

  <!-- HEADER -->

  <header class="topbar">

    <div>

      <h1>NHẬP THÔNG TIN CCCD</h1>

      <p>
        Vui lòng nhập đầy đủ thông tin khách hàng
      </p>

    </div>

  </header>


  <!-- MAIN -->

  <main>

    <section class="card input-card">

      <div class="section-title">

        <h2>Thông tin CCCD</h2>

        <p>
          Nhập thông tin và bấm Lưu thông tin
        </p>

      </div>


      <form id="cccdForm">


        <!-- HỌ TÊN -->

        <div class="form-group">

          <label for="hoTen">
            Họ và tên
          </label>

          <input
            type="text"
            id="hoTen"
            placeholder="Nhập họ và tên"
            autocomplete="off"
            required
          >

        </div>


        <!-- CCCD -->

        <div class="form-group">

          <label for="cccd">
            Số CCCD
          </label>

          <input
            type="text"
            id="cccd"
            placeholder="Nhập 12 số CCCD"
            maxlength="12"
            inputmode="numeric"
            autocomplete="off"
            required
          >

          <small class="field-note">
            CCCD phải gồm đúng 12 số
          </small>

        </div>


        <!-- ĐỊA CHỈ -->

        <div class="form-group">

          <label for="diaChi">
            Địa chỉ
          </label>

          <textarea
            id="diaChi"
            rows="3"
            placeholder="Nhập địa chỉ"
          ></textarea>

        </div>


        <!-- NƠI CẤP -->

        <div class="form-group">

          <label for="noiCap">
            Nơi cấp CCCD
          </label>

          <input
            type="text"
            id="noiCap"
            placeholder="Nhập nơi cấp CCCD"
            autocomplete="off"
          >

        </div>


        <!-- NGÀY CẤP -->

        <div class="form-group">

          <label for="ngayCap">
            Ngày cấp
          </label>

          <input
            type="date"
            id="ngayCap"
          >

        </div>


        <!-- BUTTON -->

        <button
          type="submit"
          id="saveBtn"
          class="btn btn-primary full"
        >
          Lưu thông tin
        </button>

      </form>


      <div id="formMessage"></div>

    </section>

  </main>

</div>


<script src="app.js"></script>

</body>

</html>
